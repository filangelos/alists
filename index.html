<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>alists</title>
<meta name="description" content="Places worth going, saved from Google Maps.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="alists">
<meta property="og:description" content="Places worth going, saved from Google Maps.">
<meta property="og:type" content="website">
<link rel="icon" href="./assets/pin.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bt-page">
    <div class="bt-window">
      <div class="bt-titlebar">
        <div class="bt-dots">
          <div class="bt-dot bt-dot-red"></div>
          <div class="bt-dot bt-dot-yellow"></div>
          <div class="bt-dot bt-dot-green"></div>
        </div>
      </div>

      <div class="bt-logo-header">
        <img class="bt-logo" src="./assets/pin.svg" alt="" width="46" height="32">
        <div class="bt-logo-info">
          <div class="bt-logo-title">alists</div>
          <div class="bt-logo-subtitle" id="gl-subtitle">loading…</div>
          <div class="bt-logo-subtitle" id="gl-stamp"></div>
        </div>
      </div>
      <div class="bt-header-divider"></div>

      <!-- The tree is a listbox the input owns, not a focusable region of its
           own: the caret never leaves the prompt, so a keystroke is always a
           filter and never lands somewhere it does nothing.

           Deliberately not `role="tree"`. That pattern claims every printable
           character for type-ahead, which is exactly the collision this page
           cannot afford -- any letter typed anywhere belongs to the filter.
           Rows carry an authored `aria-label` naming what they are instead,
           and since what is open is a pure function of the query there is no
           expansion state left to announce. -->
      <div class="bt-scroll" id="gl-scroll">
        <div id="gl-rows" role="listbox" aria-label="Places by city"></div>
      </div>

      <div class="bt-prompt-row">
        <div class="bt-autocomplete" id="gl-autocomplete" role="listbox" aria-label="Commands"></div>
        <div class="bt-prompt-symbol" aria-hidden="true">&#10095;</div>
        <input
          id="gl-input"
          class="bt-input"
          type="text"
          placeholder="Type to filter, / for cities"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          aria-label="Filter places"
          aria-controls="gl-rows"
        >
      </div>
      <div class="bt-footer-bar">
        <!-- Doubles as the location-state line, so it has to announce. -->
        <span id="gl-hint" aria-live="polite">/ to jump to a city · /near for distance</span>
        <span id="gl-status" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
