<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>alists</title>
<meta name="description" content="Places worth going, saved from Google Maps.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="alists">
<meta property="og:description" content="Places worth going, saved from Google Maps.">
<meta property="og:type" content="website">
<!-- The collector, named once. Both count.js and app.js read it from here so
     that a fork has one line to change, and so that a fork which has not
     changed it counts nothing and offers no recommend button -- a form that
     posted into somebody else's database would be worse than no form. -->
<meta name="alists-collector" content="https://alists-count.filangelos.workers.dev">
<!-- Where the places are served from. The same bytes are committed at
     ./data/lists.json and app.js falls back to them when this cannot be
     reached, so the file in the tree is still the record and the page still
     opens from disk -- this is the origin, not the source. Emptying this tag
     is a supported thing to do: it makes the committed copy the only copy. -->
<meta name="alists-data" content="https://alists-mcp.filangelos.workers.dev/lists.json">
<link rel="icon" href="./assets/pin.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bt-page">
    <div class="bt-window">
      <div class="bt-titlebar">
        <div class="bt-dots">
          <div class="bt-dot bt-dot-red"></div>
          <div class="bt-dot bt-dot-yellow"></div>
          <div class="bt-dot bt-dot-green"></div>
        </div>
      </div>

      <div class="bt-logo-header">
        <img class="bt-logo" src="./assets/pin.svg" alt="" width="46" height="32">
        <div class="bt-logo-info">
          <div class="bt-logo-title">alists</div>
          <div class="bt-logo-subtitle" id="gl-subtitle">loading…</div>
          <div class="bt-logo-subtitle" id="gl-stamp"></div>
        </div>

        <!-- A search field, not a prompt: no leading caret, no grammar to learn,
             and nothing typed into it is ever a command. Paths are navigated
             now, not spelled. -->
        <div class="gl-search">
          <svg class="gl-search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
            <line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
          </svg>
          <input
            id="gl-search"
            class="gl-search-input"
            type="search"
            placeholder="Search places"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            aria-label="Search places"
            aria-controls="gl-rows"
          >
          <button type="button" id="gl-clear" class="gl-clear" aria-label="Clear search" hidden>&#10005;</button>
        </div>
      </div>
      <div class="bt-header-divider"></div>

      <!-- Where you are, and the two ways back out of it. The trail is above the
           tree rather than inside it so it does not scroll away, and it is the
           same width as the rows it describes. -->
      <div class="gl-navbar">
        <!-- The trail and the way back out of it are one thing and wrap as one:
             a phone with a deep trail and two toggles has to put something on a
             second line, and a back button orphaned above its own trail is the
             one arrangement that reads as a mistake. -->
        <div class="gl-where">
          <button type="button" id="gl-up" class="gl-up" aria-label="Go back up one level">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <polyline points="10,3 5,8 10,13" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round"></polyline>
            </svg>
          </button>
          <nav class="gl-crumbs" id="gl-crumbs" aria-label="Where you are"></nav>
        </div>
        <!-- The toggles, in one group so a second one does not have to fight
             the first for the right-hand edge. A mark's button is built from
             data/lists.json rather than written here: a button for a list that
             is not in the data would be a control that turns nothing on. The
             change list is built there too and for the same reason -- a week
             that saved nothing has nothing to put behind a button.
             Both are inserted to the left of `near me`, which was there first;
             `recommend` goes to the right of it for the same reason, and is the
             only one of them that is a different colour, because it is the only
             one that writes rather than filters. -->
        <div class="gl-chips" id="gl-chips">
          <button type="button" id="gl-near" class="gl-chip" aria-pressed="false">
            <span aria-hidden="true">◎</span> near me
          </button>
          <button type="button" id="gl-suggest" class="gl-chip gl-chip-suggest"
                  aria-pressed="false" aria-controls="gl-recommend">
            <span aria-hidden="true">+</span> recommend
          </button>
        </div>
      </div>

      <!-- A real tree, now that the caret is not holding every keystroke
           hostage: rows take focus, the arrows walk them, and a letter still
           belongs to the search box, which is where it goes. Levels are flat
           with `aria-level` rather than nested groups, because what is open is
           mostly derived and re-deriving a nested DOM on every keystroke buys
           nothing a level number does not already say. -->
      <div class="bt-scroll" id="gl-scroll">
        <div id="gl-rows" class="gl-tree" role="tree" tabindex="0" aria-label="Places by city and category"></div>
        <div id="gl-empty" class="gl-empty" hidden></div>

        <!-- A view rather than a dialog, and it takes the tree's place rather
             than floating over it: `…/#%2Fathens%2Frecommend` is a link that
             means "recommend me somewhere in Athens", which a modal could not
             be. A real <form> so Enter sends it and the browser does the
             required-field check without any of this having to. -->
        <form id="gl-recommend" class="gl-recommend" hidden novalidate>
          <p class="gl-recommend-lede">
            Somewhere worth going? Paste its Google Maps link. It does not appear
            on this page — it lands in a queue only I read, and if I save it in
            Maps the tree finds it by itself the next day.
          </p>

          <label class="gl-field">
            <span class="gl-field-name">the place</span>
            <input id="gl-rec-link" type="text" maxlength="2048" required
                   placeholder="maps.app.goo.gl/… or a Maps URL"
                   spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">
            <span class="gl-field-hint">share it from the Maps app, or copy the address bar</span>
          </label>

          <label class="gl-field">
            <span class="gl-field-name">why <span class="gl-field-opt">optional</span></span>
            <textarea id="gl-rec-note" rows="2" maxlength="240"
                      placeholder="what makes it worth the trip"></textarea>
          </label>

          <label class="gl-field">
            <span class="gl-field-name">you <span class="gl-field-opt">optional</span></span>
            <input id="gl-rec-who" type="text" maxlength="40" autocomplete="name"
                   placeholder="a name, so I know who to thank">
          </label>

          <div class="gl-recommend-foot">
            <button type="submit" id="gl-rec-send" class="gl-send">recommend it</button>
            <!-- The one place this page prints a sentence written by a server.
                 Set with textContent, never innerHTML. -->
            <span id="gl-rec-said" class="gl-said" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>

      <div class="bt-footer-bar">
        <!-- Doubles as the location-state line, so it has to announce. -->
        <span id="gl-hint" aria-live="polite"></span>
        <span id="gl-status" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <!-- First, so that `glCount` exists by the time app.js counts the page it
       booted on. Nothing in app.js requires it to: every call site is guarded,
       and this file failing to load is a page that works and does not count. -->
  <script src="./count.js"></script>
  <script src="./app.js"></script>
</body>
</html>
