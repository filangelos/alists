name: refresh

# Re-reads every list in lists.txt and commits data/lists.json when it changed,
# then redeploys. `fetch.py` carries the previous timestamp forward when nothing
# moved, so "changed" here means the places changed -- not merely that the job
# ran -- and a quiet day produces no commit and no deploy.
on:
  schedule:
    # 05:17 UTC. Off the hour on purpose: GitHub queues scheduled jobs and the
    # top of the hour is the most contended slot, which is where the delay is.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lists.txt', 'scripts/fetch.py']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # No `setup-python`, no `pip install`: the fetcher is stdlib-only, so the
      # runner's own python is enough and there is no dependency that can rot
      # between one scheduled run and the next.
      - run: python3 scripts/fetch.py

      - id: commit
        name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/lists.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lists.json
          git commit -m "data: refresh lists"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Called rather than triggered -- see the comment in pages.yml.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
